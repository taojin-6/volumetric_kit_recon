name: build (reusable)

# Reusable build & test for one OS leg. ci.yml calls this once per entry in its
# build matrix. The Ubuntu legs run on a self-hosted runner in a job container
# of their release's CI image with the GPU passed through (pass `runner` +
# `image`); a macOS leg runs directly on the Mac (pass `runner`) or a
# GitHub-hosted image (pass just `os`), and checks or installs its Homebrew
# formulae.
on:
  workflow_call:
    inputs:
      os:
        description: Leg identity, used in the job name and cache key (e.g. ubuntu-24.04).
        required: true
        type: string
      runner:
        description: >-
          runs-on label. Empty → use `os` as a GitHub-hosted macOS image; set
          to a self-hosted label (vk-linux-gpu, mac) to move this leg onto your
          box.
        required: false
        type: string
        default: ''
      image:
        description: >-
          The job container's image, the CI image of the leg's Ubuntu release
          by digest, or '' to run on the runner itself (macOS).
        required: false
        type: string
        default: ''
      orbbec_sdk:
        description: >-
          Install the pinned Orbbec SDK and build with sensor's
          VS_WITH_ORBBEC=ON, so this leg builds the Orbbec driver and recon's
          live examples and runs their tests. Needs ffmpeg off macOS.
        required: false
        type: boolean
        default: false
      realsense_sdk:
        description: >-
          Install the pinned librealsense (Ubuntu: sensor's action, RealSense's
          apt repository; macOS: the runner's Homebrew formula, checked) and
          build with sensor's VS_WITH_REALSENSE=ON, so this leg builds the
          RealSense driver and fuse_realsense and runs their tests.
        required: false
        type: boolean
        default: false
      ffmpeg:
        description: >-
          Build with VS_WITH_FFMPEG=ON, so this leg builds sensor's video
          decoders, which its Orbbec driver needs. Linux only, with cuda:
          macOS builds them always, with no FFmpeg.
        required: false
        type: boolean
        default: false
      cuda:
        description: >-
          Build with VS_WITH_CUDA=ON, which sensor's decoders need off Apple,
          on the image's CUDA 13 toolkit. Needs ffmpeg.
        required: false
        type: boolean
        default: false
      ffs:
        description: >-
          Build with sensor's VS_WITH_FFS=ON, on the 24.04 image's TensorRT,
          so this leg builds sensor_ffs (FFS stereo depth) and
          fuse_realsense's FFS depth, and runs their tests. Linux only; needs
          cuda.
        required: false
        type: boolean
        default: false
      assimp:
        description: >-
          Build grid's optional mesh loader with VGRID_WITH_ASSIMP=ON (the
          macOS leg checks the assimp formula too).
        required: false
        type: boolean
        default: false
      portaudio:
        description: >-
          Build with sensor's VS_WITH_PORTAUDIO=ON (the macOS leg checks the
          portaudio formula too), so this leg builds the microphone driver the
          live examples record source.audio with.
        required: false
        type: boolean
        default: false
      build_types:
        description: >-
          JSON array of the CMAKE_BUILD_TYPEs this leg builds and tests, one
          job each, e.g. '["Release"]'.
        required: false
        type: string
        default: '["Debug","Release"]'
      sync_validation:
        description: >-
          Run the tests under the validation layer's synchronization
          validation too (VKC_TEST_SYNC_VALIDATION).
        required: false
        type: boolean
        default: false

# packages: the image is pulled from the core's GHCR package with the job's
# token; ci.yml grants it too.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.os }}
    # The image holds everything the Linux legs build and test with (the
    # core's tools/ci/images) but the Orbbec SDK and librealsense, which
    # sensor's actions install below. Its only Vulkan driver is the NVIDIA ICD
    # the container toolkit mounts (NVIDIA_DRIVER_CAPABILITIES=all), so the
    # tests run on the real GPU, and the GPU diagnostic below fails the leg
    # without it. An empty image runs the job on the runner itself: the macOS
    # leg. The token can be named only here, under `credentials`, so the
    # container is a mapping, not JSON from the caller.
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --gpus all
      # A runner's .env reaches jobs run directly on it (the Mac) but not a
      # job container, where ctest would otherwise run the suite one test at a
      # time, so the build and test fan-out is set here: 4 is a 24-core host
      # over recon's 6 runners.
      # TODO: gfx's 6 runners share each host, so 2 would match the split the
      # core's setup-runners.sh writes for jobs on the host.
      #
      # So is the NVIDIA driver's shader cache. By default it lives under
      # $HOME/.cache, which a job container lacks, and the driver then caches
      # nothing, so every test process compiled every pipeline cold: about
      # half the Test step. /__w/_tool, the runner's tool cache, outlives the
      # job, so the cache stays warm across runs (the driver keys it by driver
      # and GPU).
      env:
        NVIDIA_DRIVER_CAPABILITIES: all
        CMAKE_BUILD_PARALLEL_LEVEL: '4'
        CTEST_PARALLEL_LEVEL: '4'
        __GL_SHADER_DISK_CACHE_PATH: /__w/_tool/nvidia-glcache
        __GL_SHADER_DISK_CACHE_SKIP_CLEANUP: '1'
    timeout-minutes: 30
    defaults:
      run:
        # Inside a container GitHub runs `run:` steps under `sh` (dash), not the
        # `bash` it defaults to on hosted runners; force bash everywhere for one
        # consistent shell across legs.
        shell: bash
    env:
      # 'true' when this leg runs in a container (the self-hosted GPU boxes'
      # Ubuntu legs); drives the GPU check below.
      IN_CONTAINER: ${{ inputs.image != '' }}
    strategy:
      fail-fast: false
      # One job per build type the caller asks for: ci.yml runs an optimized
      # Release/NDEBUG build on every OS, and an unoptimized Debug one on one OS,
      # so an NDEBUG-only or optimizer-exposed break is still caught.
      matrix:
        build_type: ${{ fromJSON(inputs.build_types) }}
    steps:
      # The shader cache directory the container env names is made here: the
      # driver creates nothing above its own GLCache, and the image cannot
      # hold it, as /__w is mounted at run time.
      - name: Shader cache directory
        if: inputs.image != ''
        run: mkdir -p "${__GL_SHADER_DISK_CACHE_PATH}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect build system
        id: detect
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CMakeLists.txt found — skipping build and test."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # The leg's Homebrew formulae, named once for the key below: glm
      # supplies the GLM math headers recon_core's types alias; molten-vk is
      # the Vulkan driver; shaderc provides glslc for the compute shaders and
      # spirv-tools the spirv-val that checks them;
      # vulkan-loader/-headers/-tools/-validationlayers complete the SDK. A job
      # on the self-hosted Mac installs nothing (DECISIONS.md, 2026-10-16): it
      # fails, naming any formula missing. A hosted runner installs what its
      # image lacks.
      # TODO: take this check-or-install, and viewer.yml's check, from a core
      # action once the core has one; calib and gfx copy it too.
      - name: Install dependencies (macOS)
        id: formulae
        if: steps.detect.outputs.present == 'true' && runner.os == 'macOS'
        env:
          # The formulae we need are bottled, so skip the slow, network-heavy
          # auto-update — its `git fetch` is what flakes on transient runner DNS.
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          pkgs="cmake glm molten-vk vulkan-headers vulkan-loader vulkan-tools"
          pkgs="$pkgs vulkan-validationlayers shaderc spirv-tools"
          if [ "${{ inputs.assimp }}" = "true" ]; then
            pkgs="$pkgs assimp"
          fi
          # librealsense for sensor's VS_WITH_REALSENSE (its
          # cmake/vs_realsense.cmake).
          if [ "${{ inputs.realsense_sdk }}" = "true" ]; then
            pkgs="$pkgs librealsense"
          fi
          # PortAudio for sensor's VS_WITH_PORTAUDIO (its
          # cmake/vs_portaudio.cmake).
          if [ "${{ inputs.portaudio }}" = "true" ]; then
            pkgs="$pkgs portaudio"
          fi
          echo "formulae=$pkgs" >> "$GITHUB_OUTPUT"
          # Without brew every formula would look missing.
          command -v brew >/dev/null || {
            echo "::error::brew is not on this runner's PATH"
            exit 1
          }
          missing=""
          for pkg in $pkgs; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ] && [ "${{ runner.environment }}" = self-hosted ]; then
            echo "::error::install by hand on this self-hosted runner's host, while CI is idle:${missing}"
            exit 1
          fi
          if [ -n "$missing" ]; then
            # Retry to ride out transient Homebrew fetch/DNS blips.
            ok=0
            for attempt in 1 2 3; do
              # shellcheck disable=SC2086  # intentional: split $missing
              if brew install $missing; then
                ok=1
                break
              fi
              echo "::warning::brew install attempt ${attempt} failed; retrying in 15s"
              sleep 15
            done
            [ "${ok}" = 1 ] || {
              echo "::error::brew install failed after 3 attempts"
              exit 1
            }
          fi
          # make ships with the Xcode command-line tools.
          # The validation layer's manifest names its library without a path;
          # the Test step alone searches Homebrew's lib for it, as job-wide
          # its libraries would shadow those of every other tool.
          echo "VR_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # The installed versions of those formulae and of all they depend on:
      # the dependency cache below keys on them, so the first run after a
      # brew upgrade builds on the new versions (the core's
      # tools/runners/README.md, "Upgrading Homebrew"). The action is at the
      # core pin in third_party/CMakeLists.txt.
      - name: Homebrew key
        id: brew
        if: steps.detect.outputs.present == 'true' && runner.os == 'macOS'
        uses: taojin-6/volumetric_kit_core/.github/actions/homebrew-key@c52a86ab8fcfd11fb6afbfeaf0ae9ef2209b18b2
        with:
          formulae: ${{ steps.formulae.outputs.formulae }}

      # The Orbbec SDK, on the legs that build VS_WITH_ORBBEC: the pinned
      # release, installed as a developer does, by sensor's action at the
      # sensor pin in third_party/CMakeLists.txt, which holds the SDK pin.
      - name: Install the Orbbec SDK
        if: steps.detect.outputs.present == 'true' && inputs.orbbec_sdk
        uses: taojin-6/volumetric_kit_sensor/.github/actions/install-orbbec-sdk@25008cd713ec199980991926b1644dc0a409fb49

      # librealsense, on the Ubuntu legs that build VS_WITH_REALSENSE: the
      # pinned release from RealSense's apt repository, its key checked, by
      # sensor's action at the sensor pin, which holds the pin. The Mac's
      # formula is checked with the others above.
      - name: Install librealsense
        if: steps.detect.outputs.present == 'true' && inputs.realsense_sdk && runner.os == 'Linux'
        uses: taojin-6/volumetric_kit_sensor/.github/actions/install-librealsense@25008cd713ec199980991926b1644dc0a409fb49

      # Report the Vulkan device the runner sees (the real GPU in a self-hosted
      # container, MoltenVK on macOS). On a macOS leg a missing device is a
      # notice — the GPU-dependent tests skip themselves. In a container it
      # fails the leg: that leg exists only for the GPU behind `--gpus all`,
      # and a green build there with every GPU test skipped is exactly the
      # failure that went unnoticed for a month.
      - name: GPU diagnostic
        if: steps.detect.outputs.present == 'true'
        run: |
          if vulkaninfo --summary; then
            exit 0
          fi
          if [ "$IN_CONTAINER" = "true" ]; then
            echo "::error::no Vulkan device visible inside the GPU container — refusing to pass a leg that would skip every GPU test"
            exit 1
          fi
          echo "::notice::no Vulkan device visible — GPU tests will skip"

      # The dependency cache is keyed by the workspace *path*, so compute a short
      # fingerprint of it. See the cache step below for why the path is the thing
      # that has to match.
      - name: Workspace fingerprint
        id: ws
        if: steps.detect.outputs.present == 'true'
        run: |
          h=$(printf '%s' "${GITHUB_WORKSPACE}" |
              { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12)
          echo "hash=${h}" >> "${GITHUB_OUTPUT}"
          echo "workspace ${GITHUB_WORKSPACE} -> ${h}"

      # Cache the FetchContent dependency tree (VMA / googletest sources + builds)
      # so they are not re-cloned and recompiled every run. FetchContent bakes the
      # absolute build path into its sub-build CMakeCache, so a cache is only
      # reusable where that path is identical -- restore one built elsewhere and
      # Configure dies with "CMakeCache.txt directory ... is different than the
      # directory ... where CMakeCache.txt was created".
      #
      # The key therefore carries a hash of GITHUB_WORKSPACE: the path itself,
      # not a proxy for it. This previously keyed on `runner.name` for native
      # runners, on the assumption that a given runner's path is stable -- but
      # relocating a self-hosted runner on disk (…/actions-runner-recon-2 ->
      # …/ci-runners/volumetric_kit_recon/runner-2) changes the path while
      # keeping the name, so the key still matched and every macOS leg restored a
      # cache full of dead absolute paths and failed to configure. Hashing the
      # workspace makes a relocation a natural cache miss instead. It also
      # subsumes the `ctr` special case: containerised legs all see the same
      # /__w/… path, so they hash alike and share one key exactly as before.
      #
      # The key also hashes the conventional dep-pin home
      # (third_party/CMakeLists.txt) and the root list, so a FetchContent version
      # bump in either busts the cache; hashFiles skips whichever of those paths
      # does not exist yet. And it carries the Homebrew key (`none` off macOS)
      # and the image (on Linux), in the restore prefix too, so no tree built
      # on other Homebrew versions or in another image is restored
      # (DECISIONS.md, 2026-10-16, says why).
      - name: Cache third-party deps
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ inputs.os }}-${{ matrix.build_type }}-brew${{ steps.brew.outputs.key || 'none' }}${{ inputs.image && format('-{0}', inputs.image) || '' }}-ws${{ steps.ws.outputs.hash }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            deps-${{ inputs.os }}-${{ matrix.build_type }}-brew${{ steps.brew.outputs.key || 'none' }}${{ inputs.image && format('-{0}', inputs.image) || '' }}-ws${{ steps.ws.outputs.hash }}-

      # A self-hosted runner keeps its _work tree between jobs, so a build/ left
      # by a previous checkout survives a runner relocation with the old absolute
      # paths still baked into every CMakeCache.txt. The key change above stops
      # the *cache* carrying stale paths in, but cannot clean what is already on
      # disk -- and the Configure retry loop cannot help either, since the failure
      # is deterministic and simply fails three times.
      #
      # So: if any CMakeCache.txt under build/ records a directory other than the
      # one it now occupies, the tree is unusable. Drop it and let Configure start
      # clean. Hosted runners always start empty and no-op here.
      - name: Discard a build tree left behind at a different path
        if: steps.detect.outputs.present == 'true'
        run: |
          [ -d build ] || exit 0
          stale=$(find build -name CMakeCache.txt -exec sh -c '
            recorded=$(sed -n "s/^CMAKE_CACHEFILE_DIR:INTERNAL=//p" "$1" | head -1)
            actual=$(cd "$(dirname "$1")" && pwd)
            if [ -n "${recorded}" ] && [ "${recorded}" != "${actual}" ]; then
              echo "$1 records ${recorded}, now at ${actual}"
            fi
          ' _ {} \; | head -3)
          if [ -n "${stale}" ]; then
            echo "::warning::discarding a stale build tree:"
            echo "${stale}"
            rm -rf build
          fi

      # Default ("Unix Makefiles") generator + a parallel make build, per project
      # preference — no Ninja. The fetched sensor takes its VS_ options.
      - name: Configure
        if: steps.detect.outputs.present == 'true'
        # Retry to ride out transient FetchContent git-clone DNS blips.
        run: |
          ok=0
          for attempt in 1 2 3; do
            if cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DVS_WITH_ORBBEC=${{ inputs.orbbec_sdk && 'ON' || 'OFF' }} \
                -DVS_WITH_REALSENSE=${{ inputs.realsense_sdk && 'ON' || 'OFF' }} \
                -DVS_WITH_FFMPEG=${{ inputs.ffmpeg && 'ON' || 'OFF' }} \
                -DVS_WITH_CUDA=${{ inputs.cuda && 'ON' || 'OFF' }} \
                -DVS_WITH_FFS=${{ inputs.ffs && 'ON' || 'OFF' }} \
                -DVS_WITH_PORTAUDIO=${{ inputs.portaudio && 'ON' || 'OFF' }} \
                -DVGRID_WITH_ASSIMP=${{ inputs.assimp && 'ON' || 'OFF' }}; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      # Runs CMAKE_BUILD_PARALLEL_LEVEL jobs at once, from the runner's .env or
      # the container env as for the Test step below, or one per core where
      # neither sets it. The level is explicit because a bare --parallel
      # ignores the variable and runs an unlimited make -j.
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: |
          cmake --build build \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      # Runs CTEST_PARALLEL_LEVEL tests at once: from the runner's .env on the
      # Mac, from the container env ci.yml sets on the Ubuntu legs.
      - name: Test
        if: steps.detect.outputs.present == 'true'
        env:
          # The core's test policy (core/testing/gpu_test.hpp). Every leg has a
          # device and the validation layer, so a GPU test fails rather than
          # skips without either, and fails on any error the layer reports.
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
          VKC_TEST_SYNC_VALIDATION: ${{ inputs.sync_validation && '1' || '' }}
          DYLD_LIBRARY_PATH: ${{ env.VR_LAYER_LIBRARY_PATH }}
        run: ctest --test-dir build --output-on-failure
