name: build (reusable)

# Reusable build & test for one OS leg. ci.yml calls this once per entry in its
# build matrix. A leg can run on a GitHub-hosted runner (pass just `os`) or on a
# self-hosted runner in an OS-matched container with a GPU passed through (pass
# `runner` + `container`) — the dependency-install steps key off `runner.os`
# (Linux/macOS), so the same steps serve hosted and containerised legs alike.
on:
  workflow_call:
    inputs:
      os:
        description: Leg identity, used in the job name and cache key (e.g. ubuntu-24.04).
        required: true
        type: string
      runner:
        description: >-
          runs-on label. Empty → use `os` as a GitHub-hosted image; set to a
          self-hosted label (e.g. vk-linux-gpu) to move this leg onto your box.
        required: false
        type: string
        default: ''
      container:
        description: >-
          JSON for the job container, e.g.
          '{"image":"ubuntu:24.04","options":"--gpus all"}', or '' for none.
        required: false
        type: string
        default: ''
      orbbec_sdk:
        description: >-
          Install the pinned Orbbec SDK and build with VR_WITH_ORBBEC=ON, so
          this leg compiles cmake/vr_orbbec.cmake and runs the SDK smoke test.
          Needs ffmpeg.
        required: false
        type: boolean
        default: false
      ffmpeg:
        description: >-
          Install FFmpeg and build with VR_WITH_FFMPEG=ON, so this leg builds
          the video decoders and runs their tests. Needs cuda off macOS.
        required: false
        type: boolean
        default: false
      cuda:
        description: >-
          Install the CUDA 13 toolkit's headers and nvcc from NVIDIA's
          repository and build with VR_WITH_CUDA=ON, so this leg hands NVDEC's
          and nvJPEG's pictures out on the device and tests them. Needs
          ffmpeg.
        required: false
        type: boolean
        default: false
      assimp:
        description: >-
          Install Assimp and build the optional mesh loader with
          VR_WITH_ASSIMP=ON.
        required: false
        type: boolean
        default: false
      hevc_backend:
        description: >-
          The hardware this leg promises the decoders run on (cuda,
          videotoolbox), passed to the tests as VR_TEST_HEVC_BACKEND; the
          decoder tests then fail, rather than skip, where no device path
          opens. Empty requires none.
        required: false
        type: string
        default: ''
      build_types:
        description: >-
          JSON array of the CMAKE_BUILD_TYPEs this leg builds and tests, one
          job each, e.g. '["Release"]'.
        required: false
        type: string
        default: '["Debug","Release"]'
      sync_validation:
        description: >-
          Run the tests under the validation layer's synchronization
          validation too (VKC_TEST_SYNC_VALIDATION).
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.os }}
    # Render the container JSON to a map only when one was requested; macOS and
    # any hosted leg pass '' and run directly on the runner. `&&` short-circuits,
    # so fromJSON is never handed the empty string.
    container: ${{ inputs.container != '' && fromJSON(inputs.container) || null }}
    timeout-minutes: 30
    defaults:
      run:
        # Inside a container GitHub runs `run:` steps under `sh` (dash), not the
        # `bash` it defaults to on hosted runners; force bash everywhere for one
        # consistent shell across legs.
        shell: bash
    env:
      # 'true' when this leg runs in a container (the self-hosted GPU box's
      # Ubuntu legs, where the image is a bare ubuntu:* with the GPU passed
      # through); drives the toolchain install and the ICD choice below.
      IN_CONTAINER: ${{ inputs.container != '' }}
    strategy:
      fail-fast: false
      # One job per build type the caller asks for: ci.yml runs an optimized
      # Release/NDEBUG build on every OS, and an unoptimized Debug one on one OS,
      # so an NDEBUG-only or optimizer-exposed break is still caught.
      matrix:
        build_type: ${{ fromJSON(inputs.build_types) }}
    steps:
      # Bare ubuntu:* images lack git (actions/checkout needs it) and sudo (the
      # install steps use it); we run as root in the container, so install them
      # before anything else. Skipped on hosted runners.
      - name: Bootstrap container
        if: inputs.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git sudo

      - uses: actions/checkout@v7

      - name: Detect build system
        id: detect
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CMakeLists.txt found — skipping build and test."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (Linux)
        if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libglm-dev supplies the GLM headers + CMake config that recon_core's
          # vector/matrix types alias. vulkan-tools provides vulkaninfo;
          # glslang-tools/spirv-tools cover the compute-shader toolchain. A C/C++
          # toolchain + make ship preinstalled on hosted images but NOT in a bare
          # ubuntu:* container, so add build-essential there.
          pkgs="cmake libglm-dev libvulkan-dev vulkan-validationlayers spirv-tools glslang-tools vulkan-tools"
          if [ "$IN_CONTAINER" = "true" ]; then
            # A bare image also lacks the two client libraries the NVIDIA
            # Vulkan ICD needs before it will hand the loader a
            # vkCreateInstance: libGLX_nvidia.so.0 links libXext.so.6 and
            # dlopens libEGL.so.1 while initialising. Without them the ICD the
            # toolkit mounts is found and then discarded ("Found no drivers!"),
            # and every GPU test skips itself on the one leg that exists for
            # the GPU — which is how they silently skipped for a month.
            pkgs="$pkgs build-essential libxext6 libegl1"
          else
            # GPU-less hosted runner: lavapipe (software Vulkan) gives the
            # Vulkan-touching tests a device to run against.
            pkgs="$pkgs mesa-vulkan-drivers"
          fi
          # curl fetches the Orbbec SDK below; a bare container image lacks it.
          if [ "${{ inputs.orbbec_sdk }}" = "true" ] || [ "${{ inputs.cuda }}" = "true" ]; then
            pkgs="$pkgs curl ca-certificates"
          fi
          # FFmpeg, found through pkg-config (cmake/vr_ffmpeg.cmake). NVDEC
          # needs nothing more: the toolkit mounts libcuda and libnvcuvid, which
          # FFmpeg loads at run time.
          if [ "${{ inputs.ffmpeg }}" = "true" ]; then
            pkgs="$pkgs pkg-config libavcodec-dev libavutil-dev"
          fi
          if [ "${{ inputs.assimp }}" = "true" ]; then
            # Ubuntu 22.04's Assimp CMake export references libz.so but does
            # not pull in the development package that provides that link.
            pkgs="$pkgs libassimp-dev zlib1g-dev"
          fi
          # shellcheck disable=SC2086  # intentional: split $pkgs into separate args
          sudo apt-get install -y --no-install-recommends $pkgs
          # The CUDA toolkit for VR_WITH_CUDA (cmake/vr_cuda.cmake): cuda.h,
          # nvjpeg.h and the nvcc FindCUDAToolkit locates it by; recon
          # compiles no CUDA code. libcuda comes from the container toolkit
          # at run time, as for NVDEC, and libnvjpeg from this package.
          if [ "${{ inputs.cuda }}" = "true" ]; then
            . /etc/os-release
            repo="ubuntu$(echo "$VERSION_ID" | tr -d .)"
            curl -fsSL -o /tmp/cuda-keyring.deb \
              "https://developer.download.nvidia.com/compute/cuda/repos/${repo}/x86_64/cuda-keyring_1.1-1_all.deb"
            sudo dpkg -i /tmp/cuda-keyring.deb
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cuda-nvcc-13-4 \
              cuda-cudart-dev-13-4 cuda-driver-dev-13-4 libnvjpeg-dev-13-4
            echo "CUDAToolkit_ROOT=/usr/local/cuda-13.4" >> "$GITHUB_ENV"
          fi
          # On a hosted runner, point the loader at lavapipe for the rest of the
          # job. On the GPU box we pin nothing: the NVIDIA Vulkan ICD injected by
          # the container toolkit is then the only ICD, so the Vulkan tests run on
          # the real GPU — and if it is absent, the GPU diagnostic below fails
          # the leg rather than letting every GPU test skip.
          if [ "$IN_CONTAINER" != "true" ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies (macOS)
        if: steps.detect.outputs.present == 'true' && runner.os == 'macOS'
        env:
          # The formulae we need are bottled, so skip the slow, network-heavy
          # auto-update — its `git fetch` is what flakes on transient runner DNS.
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # Retry to ride out transient Homebrew fetch/DNS blips on the runner.
          # glm supplies the GLM math headers recon_core's types alias; molten-vk
          # is the Vulkan driver; shaderc provides glslc for the compute shaders;
          # vulkan-loader/-headers/-tools/-validationlayers complete the SDK.
          # ffmpeg (with pkgconf to find it) for a VR_WITH_FFMPEG leg.
          extra=""
          if [ "${{ inputs.ffmpeg }}" = "true" ]; then
            extra="ffmpeg pkgconf"
          fi
          if [ "${{ inputs.assimp }}" = "true" ]; then
            extra="$extra assimp"
          fi
          ok=0
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086  # intentional: split $extra
            if brew install cmake glm molten-vk vulkan-headers vulkan-loader \
                vulkan-tools vulkan-validationlayers shaderc $extra; then
              ok=1
              break
            fi
            echo "::warning::brew install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::brew install failed after 3 attempts"
            exit 1
          }
          # make ships with the Xcode command-line tools.
          # The validation layer's manifest names its library without a path;
          # the Test step alone searches Homebrew's lib for it, as job-wide
          # its libraries would shadow those of every other tool.
          echo "VR_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # The Orbbec SDK, on the legs that build VR_WITH_ORBBEC: the pinned
      # release, installed as a developer does (see the action).
      - name: Install the Orbbec SDK
        if: steps.detect.outputs.present == 'true' && inputs.orbbec_sdk
        uses: ./.github/actions/install-orbbec-sdk

      # Report the Vulkan device the runner sees (the real GPU in a self-hosted
      # container, lavapipe on a hosted Linux runner, MoltenVK on macOS). On a
      # hosted or macOS leg a missing device is a notice — the GPU-dependent
      # tests skip themselves. In a container it fails the leg: that leg exists
      # only for the GPU behind `--gpus all`, and a green build there with every
      # GPU test skipped is exactly the failure that went unnoticed for a month.
      - name: GPU diagnostic
        if: steps.detect.outputs.present == 'true'
        run: |
          if vulkaninfo --summary; then
            exit 0
          fi
          if [ "$IN_CONTAINER" = "true" ]; then
            echo "::error::no Vulkan device visible inside the GPU container — refusing to pass a leg that would skip every GPU test"
            exit 1
          fi
          echo "::notice::no Vulkan device visible — GPU tests will skip"

      # The dependency cache is keyed by the workspace *path*, so compute a short
      # fingerprint of it. See the cache step below for why the path is the thing
      # that has to match.
      - name: Workspace fingerprint
        id: ws
        if: steps.detect.outputs.present == 'true'
        run: |
          h=$(printf '%s' "${GITHUB_WORKSPACE}" |
              { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12)
          echo "hash=${h}" >> "${GITHUB_OUTPUT}"
          echo "workspace ${GITHUB_WORKSPACE} -> ${h}"

      # Cache the FetchContent dependency tree (VMA / googletest sources + builds)
      # so they are not re-cloned and recompiled every run. FetchContent bakes the
      # absolute build path into its sub-build CMakeCache, so a cache is only
      # reusable where that path is identical -- restore one built elsewhere and
      # Configure dies with "CMakeCache.txt directory ... is different than the
      # directory ... where CMakeCache.txt was created".
      #
      # The key therefore carries a hash of GITHUB_WORKSPACE: the path itself,
      # not a proxy for it. This previously keyed on `runner.name` for native
      # runners, on the assumption that a given runner's path is stable -- but
      # relocating a self-hosted runner on disk (…/actions-runner-recon-2 ->
      # …/ci-runners/volumetric_kit_recon/runner-2) changes the path while
      # keeping the name, so the key still matched and every macOS leg restored a
      # cache full of dead absolute paths and failed to configure. Hashing the
      # workspace makes a relocation a natural cache miss instead. It also
      # subsumes the `ctr` special case: containerised legs all see the same
      # /__w/… path, so they hash alike and share one key exactly as before.
      #
      # The key also hashes the conventional dep-pin home
      # (third_party/CMakeLists.txt) and the root list, so a FetchContent version
      # bump in either busts the cache; hashFiles skips whichever of those paths
      # does not exist yet.
      - name: Cache third-party deps
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ inputs.os }}-${{ matrix.build_type }}-ws${{ steps.ws.outputs.hash }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            deps-${{ inputs.os }}-${{ matrix.build_type }}-ws${{ steps.ws.outputs.hash }}-

      # A self-hosted runner keeps its _work tree between jobs, so a build/ left
      # by a previous checkout survives a runner relocation with the old absolute
      # paths still baked into every CMakeCache.txt. The key change above stops
      # the *cache* carrying stale paths in, but cannot clean what is already on
      # disk -- and the Configure retry loop cannot help either, since the failure
      # is deterministic and simply fails three times.
      #
      # So: if any CMakeCache.txt under build/ records a directory other than the
      # one it now occupies, the tree is unusable. Drop it and let Configure start
      # clean. Hosted runners always start empty and no-op here.
      - name: Discard a build tree left behind at a different path
        if: steps.detect.outputs.present == 'true'
        run: |
          [ -d build ] || exit 0
          stale=$(find build -name CMakeCache.txt -exec sh -c '
            recorded=$(sed -n "s/^CMAKE_CACHEFILE_DIR:INTERNAL=//p" "$1" | head -1)
            actual=$(cd "$(dirname "$1")" && pwd)
            if [ -n "${recorded}" ] && [ "${recorded}" != "${actual}" ]; then
              echo "$1 records ${recorded}, now at ${actual}"
            fi
          ' _ {} \; | head -3)
          if [ -n "${stale}" ]; then
            echo "::warning::discarding a stale build tree:"
            echo "${stale}"
            rm -rf build
          fi

      # Default ("Unix Makefiles") generator + a parallel make build, per project
      # preference — no Ninja.
      - name: Configure
        if: steps.detect.outputs.present == 'true'
        # Retry to ride out transient FetchContent git-clone DNS blips.
        run: |
          ok=0
          for attempt in 1 2 3; do
            if cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DVR_WITH_ORBBEC=${{ inputs.orbbec_sdk && 'ON' || 'OFF' }} \
                -DVR_WITH_FFMPEG=${{ inputs.ffmpeg && 'ON' || 'OFF' }} \
                -DVR_WITH_CUDA=${{ inputs.cuda && 'ON' || 'OFF' }} \
                -DVR_WITH_ASSIMP=${{ inputs.assimp && 'ON' || 'OFF' }}; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cmake --build build --parallel

      # Runs CTEST_PARALLEL_LEVEL tests at once: from the runner's .env on the
      # Mac, from the container env ci.yml sets on the Ubuntu legs.
      - name: Test
        if: steps.detect.outputs.present == 'true'
        env:
          VR_TEST_HEVC_BACKEND: ${{ inputs.hevc_backend }}
          # The core's test policy (tests/gpu_test.hpp). Every leg has a device
          # and the validation layer, so a GPU test fails rather than skips
          # without either, and fails on any error the layer reports.
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
          VKC_TEST_SYNC_VALIDATION: ${{ inputs.sync_validation && '1' || '' }}
          DYLD_LIBRARY_PATH: ${{ env.VR_LAYER_LIBRARY_PATH }}
        run: ctest --test-dir build --output-on-failure
