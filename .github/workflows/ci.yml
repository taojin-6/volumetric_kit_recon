name: ci

# Umbrella CI. Every platform build/test plus lint and sanitizers fan out from
# here, and the single `required` gate at the bottom succeeds only if all of
# them did. Branch protection requires just that one check ("ci / required"), so
# the protected `main` required-checks list stays stable as matrix legs (build
# types, OSes) are added or renamed — adding an OS never silently leaves an old
# required context unreported and blocking every PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only the owner triggers this repository's workflows, so no job carries a fork
# guard (DECISIONS.md, 2026-10-10).
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The Ubuntu legs run on the self-hosted GPU box (label `vk-linux-gpu`),
      # each in an OS-matched container with the GPU passed through (`--gpus
      # all`), so one host covers 24.04 / 26.04 against the real driver.
      # macOS runs natively on a self-hosted Mac (label `mac`) — macOS can't be
      # containerised. _build.yml keys its install steps off `runner.os`, so the
      # macOS leg's Homebrew/MoltenVK path is unchanged and only the Ubuntu legs
      # use a container; NVIDIA_DRIVER_CAPABILITIES=all makes the toolkit mount
      # the Vulkan ICD for those. See the core's tools/runners/README.md.
      #
      # The build and test fan-out is set in the container env, too: a runner's
      # .env reaches jobs run directly on it (the Mac) but not a job container,
      # where ctest would otherwise run the suite one test at a time. 4 is a
      # 24-core host over recon's 6 runners.
      # Each image is pinned by digest, the tag it was read from in a comment,
      # so a new image comes only with a commit that moves the pin.
      # TODO: gfx's 6 runners share each host, so 2 would match the split the
      # core's setup-runners.sh writes for jobs on the host.
      #
      # So is the NVIDIA driver's shader cache. By default it lives under
      # $HOME/.cache, which a bare image lacks, and the driver then caches
      # nothing, so every test process compiled every pipeline cold: about
      # half the Test step. /__w/_tool, the runner's tool cache, outlives the
      # job, so the cache stays warm across runs (the driver keys it by driver
      # and GPU); _build.yml's bootstrap creates it.
      #
      # Release runs on every OS; Debug only on macOS, where it is cheap. That
      # halves the jobs on the Linux GPU boxes, which gfx's CI shares, and
      # sanitizers still builds and tests Debug on Linux (clang + ASan/UBSan).
      #
      # `orbbec_sdk` puts one Linux leg and the macOS leg on sensor's
      # VS_WITH_ORBBEC=ON (the SDK installed per job; see _build.yml), and
      # leaves the others on the default OFF, so recon's live examples and
      # their tests build, and both configurations build, on every PR. Off
      # Apple the Orbbec driver needs sensor's video decoders, which `ffmpeg`
      # and `cuda` build on 24.04 (VS_WITH_FFMPEG, VS_WITH_CUDA; the toolkit
      # installed per job). sensor's own CI tests the driver and the decoders.
      # `realsense_sdk` puts every leg on VS_WITH_REALSENSE=ON, as sensor's CI
      # does (librealsense from RealSense's apt repository per job on Ubuntu,
      # the Mac's formula checked), so fuse_realsense builds on each and the
      # 26.04 leg builds it without the Orbbec driver; the sanitizer job
      # keeps the drivers off. `ffs` builds sensor_ffs (VS_WITH_FFS, TensorRT
      # from the CUDA repository per job) on 24.04, the CUDA leg, and with it
      # fuse_realsense's FFS depth; the other legs build fuse_realsense
      # without it, and their tests check that it refuses an FFS scenario.
      # `assimp` builds grid's optional mesh loader on Linux and macOS; the
      # other legs build image / PLY IO without it.
      #
      # Every leg runs the tests under the Khronos validation layer, and
      # `sync_validation` adds synchronization validation on the NVIDIA legs,
      # as the sanitizer job does on lavapipe.
      matrix:
        include:
          - os: ubuntu-24.04
            runner: vk-linux-gpu
            # ubuntu:24.04
            container: '{"image":"ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4","__GL_SHADER_DISK_CACHE_PATH":"/__w/_tool/nvidia-glcache","__GL_SHADER_DISK_CACHE_SKIP_CLEANUP":"1"}}'
            build_types: '["Release"]'
            assimp: true
            orbbec_sdk: true
            realsense_sdk: true
            ffmpeg: true
            cuda: true
            ffs: true
            sync_validation: true
          - os: ubuntu-26.04
            runner: vk-linux-gpu
            # ubuntu:26.04
            container: '{"image":"ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4","__GL_SHADER_DISK_CACHE_PATH":"/__w/_tool/nvidia-glcache","__GL_SHADER_DISK_CACHE_SKIP_CLEANUP":"1"}}'
            build_types: '["Release"]'
            realsense_sdk: true
            sync_validation: true
          - os: macos-26
            runner: mac
            container: ''
            build_types: '["Debug","Release"]'
            orbbec_sdk: true
            realsense_sdk: true
            assimp: true
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      container: ${{ matrix.container }}
      build_types: ${{ matrix.build_types }}
      orbbec_sdk: ${{ matrix.orbbec_sdk || false }}
      realsense_sdk: ${{ matrix.realsense_sdk || false }}
      ffmpeg: ${{ matrix.ffmpeg || false }}
      cuda: ${{ matrix.cuda || false }}
      ffs: ${{ matrix.ffs || false }}
      assimp: ${{ matrix.assimp || false }}
      sync_validation: ${{ matrix.sync_validation || false }}

  viewer:
    uses: ./.github/workflows/viewer.yml

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The single status check branch protection requires. It passes only when
    # every build leg, the viewer, lint, and sanitizers succeeded, and FAILS
    # (never skips) on any other outcome: a skipped required check never
    # reports its result and would block every merge forever. Runs on a hosted
    # runner so the gate can always report, even while a platform is
    # mid-migration to self-hosted.
    needs: [build, viewer, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "viewer=${{ needs.viewer.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.viewer.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
