name: ci

# Umbrella CI. Every platform build/test plus lint and sanitizers fan out from
# here, and the single `required` gate at the bottom succeeds only if all of
# them did. Branch protection requires just that one check ("ci / required"), so
# the protected `main` required-checks list stays stable as matrix legs (build
# types, OSes) are added or renamed — adding an OS never silently leaves an old
# required context unreported and blocking every PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    # The build legs run on persistent self-hosted runners, so only hand them
    # trusted code: same-repo PRs and pushes. Fork PRs skip these legs (and then
    # `required` fails, blocking auto-merge until a maintainer runs CI). The repo
    # is private today so forks can't reach this regardless — it's a guard for if
    # it ever goes public.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      # The Ubuntu legs run on the self-hosted GPU box (label `vk-linux-gpu`),
      # each in an OS-matched container with the GPU passed through (`--gpus
      # all`), so one host covers 22.04 / 24.04 / 26.04 against the real driver.
      # macOS runs natively on a self-hosted Mac (label `mac`) — macOS can't be
      # containerised. _build.yml keys its install steps off `runner.os`, so the
      # macOS leg's Homebrew/MoltenVK path is unchanged and only the Ubuntu legs
      # use a container; NVIDIA_DRIVER_CAPABILITIES=all makes the toolkit mount
      # the Vulkan ICD for those. See .github/self-hosted-runners.md.
      #
      # The build and test fan-out is set in the container env, too: a runner's
      # .env reaches jobs run directly on it (the Mac) but not a job container,
      # where ctest would otherwise run the suite one test at a time. 4 matches
      # the .env setup-linux-runner.sh writes (24 cores / 6 runners).
      #
      # `orbbec_sdk` puts one Linux leg and the macOS leg on VR_WITH_ORBBEC=ON
      # (the SDK installed per job; see _build.yml), and leaves the others on
      # the default OFF, so both configurations build on every PR.
      #
      # `ffmpeg` builds the video decoder on every leg, each against its own
      # FFmpeg (22.04's 4.4 is the floor), and `hevc_backend` names the
      # hardware each must decode on: NVDEC in the Linux containers, never an
      # integrated GPU, and VideoToolbox on the Mac. `cuda` puts the 24.04 leg
      # on VR_WITH_CUDA=ON, the toolkit installed per job, so NVDEC's pictures
      # are handed out on the device and checked there.
      # `assimp` builds the optional mesh loader on Linux and macOS; the other
      # legs build image / PLY IO without it.
      matrix:
        include:
          - os: ubuntu-22.04
            runner: vk-linux-gpu
            container: '{"image":"ubuntu:22.04","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4"}}'
            ffmpeg: true
            assimp: true
            hevc_backend: cuda
          - os: ubuntu-24.04
            runner: vk-linux-gpu
            container: '{"image":"ubuntu:24.04","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4"}}'
            orbbec_sdk: true
            ffmpeg: true
            cuda: true
            hevc_backend: cuda
          - os: ubuntu-26.04
            runner: vk-linux-gpu
            container: '{"image":"ubuntu:26.04","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4"}}'
            ffmpeg: true
            hevc_backend: cuda
          - os: macos-26
            runner: mac
            container: ''
            orbbec_sdk: true
            ffmpeg: true
            assimp: true
            hevc_backend: videotoolbox
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      container: ${{ matrix.container }}
      orbbec_sdk: ${{ matrix.orbbec_sdk || false }}
      ffmpeg: ${{ matrix.ffmpeg || false }}
      cuda: ${{ matrix.cuda || false }}
      assimp: ${{ matrix.assimp || false }}
      hevc_backend: ${{ matrix.hevc_backend || '' }}

  viewer:
    # Self-hosted like the build legs, so it carries their trusted-code guard.
    # It lives here on the caller rather than inside viewer.yml so a fork PR
    # skips this job outright and reaches `required` as `skipped` — the same
    # shape the build legs already produce, which is what the gate below is
    # written against.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/viewer.yml

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The single status check branch protection requires. It passes only when
    # every build leg, lint, and sanitizers succeeded, and FAILS (never skips)
    # on any other outcome: a skipped required check never reports its result
    # and would block every merge forever. Runs on a hosted runner so the gate
    # can always report, even while a platform is mid-migration to self-hosted.
    needs: [build, viewer, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "viewer=${{ needs.viewer.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.viewer.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
