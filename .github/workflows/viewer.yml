name: viewer (reusable)

# The leg for the gfx-linked viewer examples (VR_BUILD_VIEWER=ON).
#
# The library tiers, the default build, and every other CI leg are deliberately
# renderer-independent (the 2026-07-07 opt-in-gfx decision), so nothing else
# here ever compiles examples/viewer. That gap let a real break reach `main`:
# fuse_viewer.cpp kept declaring `Result<Mesh>` while calling `extract_device`,
# which returns `Result<DeviceMesh>`, so `-DVR_BUILD_VIEWER=ON` failed to build
# at 8a439fc and nothing noticed. This leg closes it.
#
# The live viewers need a window, and a dataset or a rig of cameras that CI
# does not carry, so they are built, not run: the compile + link is the API
# seam between recon and gfx that drifts. Their headless tests do run: the
# atlas both live viewers draw with and the render pass they record, each on a
# headless device, the device they adopt, rig_viewer's end-of-run report, and
# each viewer's config entry, which returns before any window.
# The Orbbec SDK is installed too, so rig_viewer is compiled with the other
# two.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  viewer:
    name: viewer build
    # macOS: MoltenVK is the target this example is developed against, and the
    # viewer's gfx + GLFW dependencies are already provisioned there.
    runs-on: mac
    # Measured cold on this runner -- no cache, full gfx + ImGui + spirv-cross
    # fetch and build -- the whole job is ~96 s (28 s configure, 9 s build). 20
    # minutes is ~12x that: headroom for a slow clone without parking one of the
    # Mac's two runners for an hour on a hang.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A job on the self-hosted Mac installs nothing (DECISIONS.md,
      # 2026-10-16): a missing formula fails it. This job caches nothing, so
      # it needs no Homebrew key.
      - name: Check dependencies
        run: |
          # The macOS build leg's formulae (_build.yml) less assimp, which
          # this leg does not use, plus glfw: gfx builds gfx_glfw, the
          # viewers' window glue, only with it.
          command -v brew >/dev/null || {
            echo "::error::brew is not on this runner's PATH"
            exit 1
          }
          missing=""
          for pkg in cmake glm molten-vk vulkan-headers vulkan-loader \
              vulkan-tools vulkan-validationlayers shaderc spirv-tools glfw; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error::install by hand on this self-hosted runner's host, while CI is idle:${missing}"
            exit 1
          fi

      # rig_viewer is built only with the Orbbec driver (VS_WITH_ORBBEC). The
      # action is sensor's, at the sensor pin, as in _build.yml.
      - name: Install the Orbbec SDK
        uses: taojin-6/volumetric_kit_sensor/.github/actions/install-orbbec-sdk@1fc39c0cab3f77fb3613a5277287d2e25052ca8c

      # No actions/cache step here, unlike every other leg -- deliberately, and
      # measured. build/_deps with gfx in it is a 131 MiB tarball: saving it took
      # ~49 s (half this job's wall clock, 5x the build it would accelerate) and
      # then failed outright -- "uploadCacheArchiveSDK: internal error uploading
      # cache archive: write EPIPE" -- which actions/cache reports as a warning,
      # so the leg stayed green while caching nothing. Even a working save only
      # trades the 28 s configure for a ~17 s restore. If this leg ever does get
      # slow, reach for a persistent FETCHCONTENT_BASE_DIR outside the workspace
      # (survives checkout's `git clean -ffdx`, no upload at all), not the cache.
      - name: Configure
        # Tests on for the viewers' own; the build below names its targets,
        # so the library tests, which every build leg runs, are not built.
        # Retry rides out transient FetchContent clone blips, as in
        # _build.yml.
        run: |
          ok=0
          for attempt in 1 2 3; do
            if cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DVR_BUILD_VIEWER=ON -DVR_BUILD_TESTS=ON -DVS_WITH_ORBBEC=ON; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      # Name the viewer targets explicitly rather than building everything, so
      # this leg fails for the reason it exists rather than on some unrelated
      # target, and so it does not re-do what the build legs already cover.
      # The level is explicit, as in _build.yml's Build step.
      - name: Build viewer examples
        run: |
          cmake --build build \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}" \
            --target fuse_viewer fuse_render rig_viewer \
            recon_example_viewer_atlas_test recon_example_viewer_device_test \
            recon_example_viewer_pass_test recon_example_viewer_rig_report_test

      # The viewers' headless tests, on the core's test policy as in
      # _build.yml's Test step: a device and the validation layer required.
      # None opens a window.
      - name: Test viewer examples
        env:
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
        run: |
          prefix=$(brew --prefix)
          export VK_LAYER_PATH="${prefix}/share/vulkan/explicit_layer.d"
          export DYLD_LIBRARY_PATH="${prefix}/lib"
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^recon_(example_viewer_|(fuse_render|fuse_viewer|rig_viewer)_config_entry$)'
