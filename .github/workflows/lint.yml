name: lint

# Styling + docs gate, and the workflows' fork guards. `lint` runs the same
# hooks as the local `pre-commit` install. Linux-only: clang-format and
# cmake-format output is deterministic across operating systems, so one runner
# is enough. Invoked by ci.yml, which owns the push / pull_request triggers and
# the concurrency group.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Cache pre-commit's installed hook environments (incl. the pinned
      # clang-format) keyed on the config so they're only rebuilt when it changes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          # Reuse the unchanged hook envs across config edits (e.g. a rev bump)
          # instead of rebuilding every environment from cold.
          restore-keys: |
            pre-commit-
      # Pin the runner so a new upstream pre-commit release can't change the
      # merge-gate's behavior without a commit here.
      - run: python -m pip install pre-commit==4.6.2
      - run: pre-commit run --all-files --show-diff-on-failure

  fork-guards:
    # The core's checker of the fork guards (DECISIONS.md, 2026-10-08), from a
    # pinned checkout: a workflow edit that drops one fails here.
    name: fork guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # TODO: this is volumetric_kit_core#16's head. Once it lands, move the
      # core pin in third_party/CMakeLists.txt to a commit with tools/ci and
      # read this ref from that GIT_TAG, so recon pins the core once.
      - uses: actions/checkout@v7
        with:
          repository: taojin-6/volumetric_kit_core
          ref: 8f689102b14b80a8087b6f35609022d85089211e
          path: volumetric_kit_core
          sparse-checkout: tools/ci
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r volumetric_kit_core/tools/ci/requirements.txt
      - run: python volumetric_kit_core/tools/ci/check_fork_guards.py .github/workflows
